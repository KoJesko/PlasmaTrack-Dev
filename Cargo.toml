[workspace]
resolver = "2"
members = ["crates/pt-core"]

[workspace.package]
edition = "2021"
rust-version = "1.80"
publish = false
license = "PolyForm-Noncommercial-1.0.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "1"
serde_json = "1"
sha2 = "0.10"
