# PlasmaTrack sample configuration.
#
# Every threshold carries its unit in the key name:
#   _mph, _mi, _km, _l (litres), _l_per_s, _s (seconds of paused simulation
#   time unless noted), _wall_s (wall-clock seconds), _min_game (in-game minutes),
#   _hz, _frames.
# Distances are qualified: _world_ = physical 1:1 distance (odometer / local.scale,
# what points use); _game_ = the game's own scale (odometer, job list, map);
# _world_m = metres of the 3D world (positions).
#
# Unit conversions are fixed by the spec and are NOT configurable:
#   1 km = 0.621371 mi, mph = m/s x 2.23694 (see crates/pt-core/src/units.rs).
#
# Copy to config/plasmatrack.toml (git-ignored). Only [local] may differ per
# driver; everything else must match a server-published config version.
# Values marked PROVISIONAL must be calibrated from real game captures.

config_version = 1

# ---------------------------------------------------------------------------
# Scoring rules (server is authoritative; client uses the same values for its
# provisional result). Rule numbers match the spec's precedence table.
# ---------------------------------------------------------------------------
[rules]
# Rule 3: loaded WORLD distance (physical 1:1, PLAN §6) strictly
# greater than this is held for review.
manual_review_over_world_km = 150.0
# Rule 5: accepted distance = driven distance x this factor when penalized.
speed_penalty_factor = 0.85
# Rule 6: points per accepted WORLD mile (physical 1:1 distance = odometer /
# local.scale, PLAN §6). The job total is floored once, at the end.
points_per_world_mi = 1.0

[rules.speed]
# "Over X" means strictly over X for longer than this window (single-sample
# spikes never count). Measured in paused simulation time, so pausing the game
# neither adds time to nor splits an episode.
sustained_window_s = 3.0
# Speeds are compared after rounding to this precision, so a sample of exactly
# 105.0 mph is not "over 105".
compare_precision_mph = 0.001

[rules.speed.ats]
penalty_over_mph = 105.0   # rule 5
invalid_over_mph = 125.0   # rule 2

[rules.speed.ets2]
penalty_over_mph = 100.0   # rule 5
invalid_over_mph = 150.0   # rule 2

[rules.distance]
# Distances are compared after rounding to this precision (150.0 km is not
# "over 150"; 150.1 km is). Distance thresholds are in km, so this is in km too.
compare_precision_km = 0.001
# Odometer comparisons use max(4 x ulp(odometer), this value), because the SDK
# odometer channel is a 32-bit float in km (scssdk_telemetry_truck_common_channels.h:640-645).
odometer_epsilon_km = 0.005
# Scored world distance is the game's job.delivered distance.km (PLAN §6). If it
# differs from the tracker's own odometer / local.scale figure by more than the
# GREATER of these two (pct is relative to the larger figure)
# the job goes to manual review. PROVISIONAL until a
# delivery capture (C7) shows how closely they agree.
delivered_vs_trace_tolerance_pct = 1.0
delivered_vs_trace_tolerance_min_mi = 30.0
# All measured on the SDK-reported delivery distance (job.delivered distance.km,
# in miles): the job length for the short-job test, the floor and the percentage.
# Jobs shorter than short_job_under_mi are hard-capped at short_job_max_pct.
delivered_vs_trace_short_job_under_mi = 100.0
delivered_vs_trace_short_job_max_pct = 5.0

[rules.fuel]
# Rule 4: job fuel used below -tolerance is flagged (float noise stays silent).
negative_fuel_tolerance_l = 0.5
# A fuel increase within one tracked run larger than this, outside a detected
# refuel episode, is stored as a "mid-job fuel jump" with its timestamp.
mid_job_jump_tolerance_l = 0.5

[rules.refuel]
# The SDK has no refuel event (scssdk_telemetry_common_gameplay_events.h), so a
# refuel is inferred from the fuel channel. PROVISIONAL.
stationary_below_mph = 1.0
min_duration_s = 1.0
min_rate_l_per_s = 0.5
max_rate_l_per_s = 200.0

# ---------------------------------------------------------------------------
# Review policy. Every flag in PlasmaTrack means MANUAL REVIEW: the job is
# pending and its points are held until an admin approves or rejects it
# (via the Discord bot). This includes rule 4 (negative fuel).
#   "review" = send to manual review
#   "off"    = not raised
# ---------------------------------------------------------------------------
[review_policy]
gap = "review"          # forward load / untracked stretch inside a job
late_start = "review"   # job first seen mid-job; distance comes from job.delivered distance.km
trace_checks = "review" # trace-measured mismatches: sample timing, seq gaps, hello vs data (§6a)
# Gaps smaller than BOTH of these are ignored (e.g. a brief socket hiccup).
min_gap_distance_mi = 0.1
min_gap_duration_s = 5.0

# Extra heuristics: manual review only (never invalidation), OFF by default.
[review_flags]
teleport_without_ferry_train_load = false
odometer_jump = false
impossible_delivery_time = false

[review_flags.params]
# Units: "_world_m" is metres of the game's 3D world (truck.world.placement).
# The game's own distances (odometer, job distances, the map) are those world
# metres x local.scale (3 in cities, 20 on open roads in ATS; measured in the
# first capture), so 500 world m is about 10 game km on an open road.
# Average speeds are world distance over simulated time (what the speedometer
# shows); odometer over real time would read up to 20x too fast.
teleport_min_distance_world_m = 500.0
odometer_jump_min_km = 1.0
min_plausible_avg_speed_mph = 0.0
max_plausible_avg_speed_mph = 150.0

# ---------------------------------------------------------------------------
# Save-load / timeline detection. ALL PROVISIONAL until capture-calibrated.
# ---------------------------------------------------------------------------
[timeline]
# A load is a world reload (job and truck configs emptied in one bracket), or a
# session change plus a discontinuity against the last kept state (PLAN §5).
# A pause bracket alone is never evidence. game.time is used in singleplayer
# only (TruckersMP runs a server-side clock).
game_time_decrease_min_game = 1
bracket_min_live_frames_after_started_frames = 30
bracket_wall_cap_wall_s = 600.0
gameplay_event_explain_window_wall_s = 2.0
ferry_train_explain_window_wall_s = 10.0
# Loaded state must match a previously observed point within these tolerances
# to count as "the same point" (for truncation or for restoring a reverted run).
# Position is in world metres (x local.scale for game distance).
match_position_tolerance_world_m = 50.0
match_fuel_tolerance_l = 1.0
match_game_time_tolerance_min_game = 2

# ---------------------------------------------------------------------------
# Player notifications (desktop notification from the client).
# Sent for: a delivery marked Invalid (rule 2) and the moment the speed
# penalty (rule 5) activates. Each is delayed by a uniformly random time in
# [delay_min_wall_s, delay_max_wall_s] with microsecond resolution.
# ---------------------------------------------------------------------------
[notifications]
enabled = true
delay_min_wall_s = 5.0
delay_max_wall_s = 30.0

# ---------------------------------------------------------------------------
# Multiplayer. All multiplayer is tracked (TruckersMP, other MP mods, Convoy).
# Convoy is detected from multiplayer.time.offset != 0
# (common/scssdk_telemetry_common_channels.h:287-300). The SDK cannot identify
# TruckersMP, so the plugin reports whether any of these module file names is
# loaded in the game process. PROVISIONAL: empty until confirmed by capture.
# Users with the "Singleplayer Division" flag have TruckersMP jobs discarded.
# ---------------------------------------------------------------------------
[multiplayer]
truckersmp_module_names = []

# ---------------------------------------------------------------------------
# Plugin <-> client transport (localhost only).
# ---------------------------------------------------------------------------
[plugin]
sample_rate_hz = 20.0
# Frames kept in memory for a reconnecting client (samples only; gameplay and
# config events are journaled to disk until the client acknowledges them).
replay_buffer_wall_s = 120.0

# ---------------------------------------------------------------------------
# Client -> server sync.
# ---------------------------------------------------------------------------
[sync]
# Failed uploads are retried at this fixed interval, forever, until they succeed.
retry_interval_wall_s = 20.0

# ---------------------------------------------------------------------------
# Per-driver settings. This is the ONLY section excluded from the integrity
# check: every other key must match a config version published by the server,
# or the job is discarded (rule 0).
# ---------------------------------------------------------------------------
[local]
listen_address = "127.0.0.1"
port = 30455
server_url = "https://plasmatrack.example.invalid"
# Local status page of the client: http://127.0.0.1:<status_port>/
status_port = 30456
# Player token issued by the server (via the Discord bot). Keep this file private.
token = ""
