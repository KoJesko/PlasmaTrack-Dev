[package]
name = "pt-client"
version = "0.2.2"
description = "PlasmaTrack client: receives plugin telemetry, keeps the local SQLite log, uploads raw chunks to the server."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "plasmatrack-client"
path = "src/main.rs"

[[bin]]
name = "plasmatrack-clientw"
path = "src/bin/clientw.rs"

[[bin]]
name = "plasmatrack-uninstall"
path = "src/bin/uninstall.rs"

[dependencies]
pt-core = { path = "../pt-core" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
toml.workspace = true
toml_edit = "0.22"
getrandom = "0.4"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
dirs = "6"
flate2 = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
