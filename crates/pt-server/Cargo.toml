[package]
name = "pt-server"
version = "0.1.0"
description = "PlasmaTrack server logic: ingest, scoring, the bot-facing API and webhooks. Runs on Cloudflare Workers through pt-worker; tested natively."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
pt-core = { path = "../pt-core" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
toml.workspace = true
flate2 = "1"

[dev-dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["rt", "macros"] }
pt-replay = { path = "../pt-replay" }
